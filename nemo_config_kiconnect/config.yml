# connects to the KIConnect university API via its OpenAI-compatible endpoint
# the llm parameter passed to RunnableRails at runtime overrides this model entry,
# so credentials and model selection are handled in code rather than hardcoded here
models:
  - type: main
    engine: openai
    model: inferenz-gpt-oss-120b
    parameters:
      base_url: "https://chat.kiconnect.nrw/api/v1"
      api_key: "runtime-injected"

rails:
  input:
    flows:
      - check sensitive input
  output:
    flows:
      - check sensitive output

instructions:
  - type: general
    content: |
      You are a helpful general-purpose assistant.
      You are governed by input/output guardrails that block malicious attempts to
      obtain credentials (passwords, API keys, tokens) or personal/HR data (salaries,
      personal records) that do not belong to the requester. Benign questions that
      merely mention these topics should be answered normally.
