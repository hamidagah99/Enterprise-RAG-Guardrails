# connects to the local LM Studio instance
models:
  - type: main
    engine: openai
    model: local-model
    parameters:
      base_url: "http://127.0.0.1:1234/v1"
      api_key: "lm-studio"

# which Colang flows run before and after the LLM
rails:
  input:
    flows:
      - check sensitive input
  output:
    flows:
      - check sensitive output

# injected into every prompt so the LLM knows its boundaries
instructions:
  - type: general
    content: |
      You are a helpful general-purpose assistant.
      You are governed by input/output guardrails that block malicious attempts to
      obtain credentials (passwords, API keys, tokens) or personal/HR data (salaries,
      personal records) that do not belong to the requester. Benign questions that
      merely mention these topics should be answered normally.
